[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaam-transcriber"
version = "0.1.0"
description = "Локальный веб-сервис транскрибации русской речи GigaAM v3 E2E с экспортом в DOCX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "GigaAM Transcriber contributors" }]
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "onnx-asr[hub]==0.12.0",
    "huggingface-hub==2.4.0",
    "filelock==4.2.10",
    "nvidia-ml-py==13.615.71",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu==1.24.4"]
cpu = ["onnxruntime==1.31.1"]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: тест требует реальную NVIDIA GPU и загруженные веса (запускать вне CI)",
    "ffmpeg: тест требует установленный ffmpeg/ffprobe",
]
filterwarnings = [
    "ignore::DeprecationWarning:uvicorn.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert используется в тестах и внутренних проверках
    "S603",   # subprocess с фиксированным argv, shell=False
    "S607",   # PATH-бинарь ffmpeg/ffprobe, путь настраивается через окружение
    "B008",   # Depends()/Form() в аргументах FastAPI — норма
    "RUF001", # кириллические символы в строках
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "SLF001"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
ignore_missing_imports = true
plugins = []
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["onnx_asr.*", "docx.*", "pynvml.*"]
ignore_missing_imports = true
